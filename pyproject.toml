[project]
name = "openwhistle-website"
version = "0.0.0"
description = "openwhistle.net: the website and documentation of OpenWhistle"
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "OpenWhistle Contributors" }]
# Not a package: scripts/ builds the site from docs/; nothing is installed.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.2.0",
    "ruff>=0.15.0",
]
e2e = [
    "playwright>=1.61.0",
    "pytest-playwright>=0.8.0",
    "pytest-base-url>=2.1.0",
]

[tool.uv]
package = false

# ─── mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["fontTools.*", "yaml.*", "playwright.*"]
ignore_missing_imports = true

# ─── ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S110"]
"tests/e2e/*" = ["S101", "S105", "S106", "S107", "S110"]
# The page shell is copied verbatim from docs/en/roadmap/index.html as a template string;
# its CSS/HTML lines are not code and keep that page's own line lengths.
"scripts/render_changelog.py" = ["E501"]

# ─── pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ are files, not a package: tests import them as the build does
pythonpath = ["scripts", "."]
addopts = "--cov=scripts --cov-report=term-missing --cov-fail-under=90 --ignore=tests/e2e --ignore=tests/website"

markers = [
    "e2e: browser tests against the built site or the website container",
    "website: tests against a running website container (WEBSITE_URL)",
]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
site = [
    "fonttools[woff]>=4.66.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pagefind[extended]>=1.5.2",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
]
