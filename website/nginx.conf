# openwhistle.net (docs-tech/specs/2026-10-09-website-p4-design.md). The whole configuration, main
# context included: the base image's own nginx.conf logs at notice, and nginx error lines carry the
# client's address.
worker_processes auto;
error_log stderr emerg;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # The root filesystem is read-only; only /tmp is writable.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The redirect map has long keys (nginx: could not build map_hash at the default 64).
    map_hash_bucket_size 128;
    sendfile on;
    server_tokens off;
    charset utf-8;

    # The page counter: four fields, no address, no agent, no query (redesign spec D5).
    # A map's regexes match in order: an IP literal (v4, or v6 in brackets) is an address, not a host.
    map $http_referer $ref_host {
        "~^https?://(?:[^@/]*@)?(?:[0-9.]+|\[[0-9A-Fa-f:.]*\])(?:[:/?#]|$)" "-";
        "~^https?://(?:[^@/]*@)?(?<rhost>[A-Za-z0-9.-]+)(?:[:/?#]|$)" $rhost;
        default "-";
    }
    log_format counter '$time_iso8601 $uri $status $ref_host';
    access_log /dev/stdout counter;

    map $http_accept_language $home {
        "~*^de" /de/;
        default /en/;
    }
    map $uri $moved {
        default "";
        include /etc/nginx/redirects.map;
    }
    map $uri $vary_language {
        "/" "Accept-Language";
        "/index.html" "Accept-Language";
        default "";
    }
    # The pages that carry the operator's name and address stay out of search results by header
    # too: the meta tag alone is lost wherever a crawler reads only the headers.
    map $uri $robots {
        "~^/(impressum|de/datenschutz|en/privacy)/" "noindex";
        default "";
    }
    map $uri $csp {
        "~^/(en/docs|pagefind)/" "docs"; # the search worker compiles the WASM under its own response's policy
        default "site";
    }
    map $csp $csp_value {
        "site" "default-src 'none'; script-src 'self' 'sha256-aTVT2yTZj8X3C8V1QPnib4HTXa5Npxc/Hah1pqj89gY=' 'sha256-V29hLe3WV/jChb7JJqgWgSXXtSrfjeye+kxAdKytOPU='; style-src 'self'; img-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
        "docs" "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-aTVT2yTZj8X3C8V1QPnib4HTXa5Npxc/Hah1pqj89gY=' 'sha256-V29hLe3WV/jChb7JJqgWgSXXtSrfjeye+kxAdKytOPU=' 'sha256-EiBNpe2AQxJJZAr35411/QiW8qqrAKTcWB85PEg8OGo=' 'sha256-20y/3E3VCTAoJhpMoiHuJNrP76AYnndlNwVsDxsgkEM='; style-src 'self'; img-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Behind the host nginx a relative Location keeps https and the public host.
        absolute_redirect off;
        gzip_static on;
        gzip_vary on;
        etag on;

        # Server level only: an add_header in a location would drop every one of these.
        add_header Content-Security-Policy $csp_value always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cache-Control "no-cache" always;
        add_header Vary $vary_language always;
        add_header X-Robots-Tag $robots always;

        error_page 403 404 /404.html;

        if ($moved) {
            return 301 $moved;
        }
        location = / {
            return 302 $home;
        }
        location = /index.html {
            return 302 $home;
        }
        # No try_files: the static module 301s a directory without its slash, serves index.html
        # for a slash and 404s the rest.
        location / { }
        # The private address fragment (rendered by the operator, mounted read-only): only an SSI
        # include on a legal page can reach it, never a request.
        location /_private/ {
            internal;
            alias /usr/share/nginx/private/;
        }
        # Healthy only when nginx can read the fragment, as the legal pages' include does: a
        # missing file is a 404, an unreadable one (not 0444) a 403, and either fails the probe.
        # It used to test `-f` only, so an unreadable fragment answered 204 while the legal pages
        # embedded the 404 page where the address belongs. An empty file still passes.
        location = /healthz {
            access_log off;
            auth_request /_private/address.html;
            error_page 403 500 = @unhealthy;
            try_files /.healthz =204; # never a real file; runs after the access phase
        }
        location @unhealthy {
            return 503;
        }
        # SSI needs the plain file: the prebuilt .gz would bypass it.
        location ~ ^/(impressum|de/datenschutz|en/privacy)/ {
            ssi on;
            gzip_static off;
        }
    }
}
