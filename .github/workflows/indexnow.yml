name: IndexNow

# After a verified rollout: `gh workflow run indexnow.yml`. Sends the live sitemap's URLs to the
# IndexNow engines (Bing and others). The key is public by design (docs/_data/site.yml).
on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Ping IndexNow
        run: python scripts/indexnow.py
