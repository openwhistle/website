name: Website image

# openwhistle.net as a container (docs-tech/specs/2026-10-09-website-p4-design.md). Every pull request
# builds, runs and tests the image; main publishes it. The site documents the latest release of
# openwhistle/OpenWhistle (scripts/release_source.py): the weekly run turns a release whose
# documentation is missing red within a week (docs-tech/specs/2026-10-09-website-repo-split-design.md).
on:
  push:
    branches: ["main"]
    paths: &paths
      - "docs/**"
      - "website/**"
      - "scripts/**"
      - "DESIGN.md"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - ".github/workflows/website-image.yml"
  pull_request:
    branches: ["main"]
    paths: *paths
  # Weekly: a new app release meets its documentation (S-6), and security.txt, which expires
  # ~335 days after the build that wrote it (P4-10), stays young.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

# Whole runs, not the publish job: a job-level group orders by when each test job ends, so an older
# build could publish last and own latest. Runs start in trigger order, a newer pending run replaces
# an older one, and a running publish is never cancelled half way.
concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Website container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }} # the release publish must build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the sitemap's lastmod comes from each source's last commit

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.24

      - name: Install the test tools
        run: |
          uv export --frozen --extra dev --extra e2e --group site --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt
          playwright install chromium --with-deps

      # One release for every step below: the tests, the browser suite and the image read it here.
      - name: Fetch the latest app release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Assignments, not an echo of $(…): a failed fetch fails the step. The tag is resolved
        # once and pinned, so the tests, the image and the publish job read one release.
        run: |
          tag=$(python scripts/release_source.py --tag)
          dir=$(OW_RELEASE_TAG="$tag" python scripts/release_source.py --relative)
          { echo "tag=$tag"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"

      - name: The documentation matches the release (unit suite)
        env:
          OW_APP_SOURCE: ${{ steps.release.outputs.dir }}
        run: pytest -q -p no:cacheprovider

      - name: Browser tests against the built site
        env:
          OW_APP_SOURCE: ${{ steps.release.outputs.dir }}
        run: pytest tests/e2e -m e2e --browser chromium -q --no-cov -p no:cacheprovider

      - name: Build the image
        env:
          OW_APP_SOURCE: ${{ steps.release.outputs.dir }}
        run: docker build -f website/Dockerfile --build-arg OW_APP_SOURCE -t openwhistle-website:test .

      - name: Start it as it will run (read-only, unprivileged)
        run: |
          docker run -d --name ow-website --read-only --tmpfs /tmp \
            -v "$PWD/tests/website/fixtures/private:/usr/share/nginx/private:ro" -p 8080:8080 openwhistle-website:test
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/en/ && break; sleep 1; done

      - name: Container tests
        env:
          WEBSITE_URL: http://127.0.0.1:8080
          WEBSITE_CONTAINER: ow-website
        run: pytest tests/website -q --no-cov -p no:cacheprovider

      - name: Browser tests against the container
        env:
          WEBSITE_URL: http://127.0.0.1:8080
          WEBSITE_REQUIRED: "1" # the step against the built site collects this file too, without a container
        run: pytest tests/e2e/test_site_container.py -m e2e --browser chromium -q --no-cov -p no:cacheprovider

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openwhistle-website:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish, sign and verify
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/openwhistle/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Fetch the release the test job tested
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OW_RELEASE_TAG: ${{ needs.test.outputs.tag }}
        # Never the latest again: a release published while the tests ran was not tested.
        run: |
          test -n "$OW_RELEASE_TAG"
          dir=$(python scripts/release_source.py --relative)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: website/Dockerfile
          build-args: OW_APP_SOURCE=${{ steps.release.outputs.dir }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/website-image.yml@refs/heads/main
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "Published ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
