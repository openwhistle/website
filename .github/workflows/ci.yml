name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.24

      - name: Install dependencies
        # Exactly the versions in uv.lock.
        run: |
          uv export --frozen --extra dev --group site --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run ruff (linting)
        run: ruff check .

      - name: Run ruff (formatting)
        run: ruff format --check .

      - name: Spelling (codespell)
        run: uvx codespell==2.4.3

      - name: Workflow security (zizmor)
        run: uvx zizmor==1.30.1 --offline .github/workflows

      - name: Run mypy (type checking)
        run: mypy scripts/ --strict

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !.venv
            !node_modules
            !.superpowers
            !.claude
            !.serena
            !.release

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # tests/built_site.py reads each source's last commit for the sitemap

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.12.24

      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --group site --no-emit-project -o /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # tools/seo: yoastseo only; lighthouse is optional and not needed by the tests.
      - name: Install the SEO tool
        run: npm --prefix tools/seo ci --omit=optional --ignore-scripts

      # The guards compare the docs with the latest release of openwhistle/OpenWhistle
      # (scripts/release_source.py); the token lifts the API's 60-an-hour limit per runner IP.
      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Arms the personal-data leak guard (docs-tech/website-image.md); a fork's PR has no
          # secrets, and the guard skips. The tests print an index, never a string.
          OW_PRIVATE_STRINGS: ${{ secrets.OW_PRIVATE_STRINGS }}
        run: pytest
