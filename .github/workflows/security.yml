name: Security

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"  # Mondays: new CVEs appear without a code change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: pip-audit (uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv==0.12.24
      - name: Audit every locked dependency (the site build and the test tools)
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --strict -r /tmp/requirements.txt

  image:
    name: Trivy (published image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The image as it runs on openwhistle.net; website-image.yml scans every new build itself.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/openwhistle/website:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
